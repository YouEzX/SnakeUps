<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e13">
<title>Snake UPS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23101820%22/><circle cx=%2216%22 cy=%2218%22 r=%2210%22 fill=%22%23b3202f%22/><path d=%22M16 9q1-5 5-5%22 stroke=%22%23468a3c%22 stroke-width=%223%22 fill=%22none%22/></svg>">
<style>
:root{--txt:#e6edf3;--mute:#8b98a5;--teal:#2fa392;--amber:#e0a526;--card:rgba(255,255,255,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--txt);min-height:100%;
 background:linear-gradient(135deg,#090e13,#101a24,#0b1a1c,#090e13);background-size:400% 400%;animation:bg 24s ease infinite;
 display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;
 user-select:none;-webkit-user-select:none;--rsv:270px}
body[data-device=mobile]{--rsv:175px}
body[data-device=mobile][data-tc=dpad]{--rsv:345px}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.2;z-index:0;animation:float 18s ease-in-out infinite}
.orb.a{width:320px;height:320px;background:#2fa392;top:-90px;left:-80px}
.orb.b{width:360px;height:360px;background:#3a5a8c;bottom:-110px;right:-90px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-40px) scale(1.15)}}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.off{display:none!important}
body[data-device=mobile] .only-pc,body[data-device=desktop] .only-m{display:none!important}
kbd{font:600 11px ui-monospace,Consolas,monospace;padding:2px 7px;border-radius:5px;border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;background:rgba(255,255,255,.07);color:var(--mute);display:inline-block}
.btn{font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#fff;border-radius:8px;padding:12px 26px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
 background:linear-gradient(180deg,#34b3a0,#1f7468);box-shadow:0 4px 0 #134a43,0 8px 22px rgba(47,163,146,.3);transition:transform .12s}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:0 3px 0 rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);color:var(--txt)}
.btn.danger{background:linear-gradient(180deg,#c85a50,#8e3028);box-shadow:0 3px 0 #561b16}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px)}
.ibtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);transition:background .15s}
.ibtn:hover{background:rgba(255,255,255,.15)}.ibtn svg{width:20px;height:20px}

/* ===== menú principal ===== */
#scrMenu{position:fixed;inset:0;z-index:4;display:flex;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));animation:scr .45s ease}
@keyframes scr{from{opacity:0;transform:translateY(14px)}}
.mbg{position:fixed;inset:0;background-image:linear-gradient(rgba(110,190,200,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(110,190,200,.09) 1px,transparent 1px);
 background-size:44px 44px;animation:gridmove 14s linear infinite;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 15%,transparent 72%);mask-image:radial-gradient(circle at 50% 45%,#000 15%,transparent 72%)}
@keyframes gridmove{to{background-position:44px 44px}}
.fl{position:fixed;bottom:-60px;opacity:.11;color:#4fd1a5;animation:rise linear infinite;pointer-events:none}
.fl svg{width:var(--s);height:var(--s)}
@keyframes rise{to{transform:translateY(-120vh) rotate(200deg)}}
.mwrap{position:relative;z-index:1;margin:auto;width:100%;max-width:860px;display:grid;grid-template-columns:minmax(300px,390px) minmax(260px,350px);gap:34px;align-items:center;justify-content:center}
.mleft{display:flex;flex-direction:column;gap:26px}
.brand{display:flex;flex-direction:column;gap:4px}
.logo{width:64px;height:64px;color:#4fd1a5;stroke-width:1.5;margin-bottom:6px}
.logo path:first-child{stroke-dasharray:30 12;animation:dash 2.2s linear infinite}
.logo path:last-child{animation:blink 2.2s steps(1) infinite}
@keyframes dash{to{stroke-dashoffset:-84}}
.brand h2{font-size:60px;letter-spacing:9px;line-height:1;font-weight:800;background:linear-gradient(90deg,#9fb4c7,#fff,#4fd1a5,#9fb4c7);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.brand small{letter-spacing:12px;color:var(--amber);font-size:14px;font-weight:700;padding-left:4px}
.mnav{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:17px;font-weight:600;text-align:left;
 transition:transform .15s,background .15s,border-color .15s;animation:rowin .5s both}
.mbtn:nth-child(2){animation-delay:.07s}.mbtn:nth-child(3){animation-delay:.14s}.mbtn:nth-child(4){animation-delay:.21s}.mbtn:nth-child(5){animation-delay:.28s}
@keyframes rowin{from{opacity:0;transform:translateX(-24px)}}
.mbtn svg{width:22px;height:22px;color:var(--teal)}
.mbtn span{flex:1}
.mbtn:hover,.mbtn:focus-visible{background:rgba(47,163,146,.16);border-color:var(--teal);transform:translateX(6px);outline:none}
.mbtn.primary{background:linear-gradient(180deg,#34b3a0,#1f7468);border-color:#4fd1a5;font-size:20px;padding:18px;letter-spacing:2px;text-transform:uppercase;animation:rowin .5s both,glow 2.4s ease-in-out .6s infinite}
.mbtn.primary svg{color:#fff;fill:currentColor}
.mbtn.primary kbd{color:#d8fff3;border-color:rgba(255,255,255,.4)}
@keyframes glow{50%{box-shadow:0 0 36px rgba(79,209,165,.55)}}
.mcard{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(8px);animation:rowin .6s .2s both}
.mcard h4,.cbody h4{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mute);font-weight:700}
.rec{display:flex;align-items:center;gap:14px}
.rec svg{width:36px;height:36px;color:var(--amber)}
.rec b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.rec small{display:block;color:var(--mute);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
.leg{display:flex;gap:8px;align-items:center;font-size:13px}
.leg svg{color:var(--c);width:20px;height:20px}
.leg b{font-weight:600}.leg small{display:block;color:var(--mute);font-size:11px}
.keyrow{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:13px;color:var(--mute)}
.keyrow div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.keyrow em{font-style:normal;margin:0 2px}
.mrec{display:none;align-items:center;gap:8px;align-self:center;padding:8px 18px;border-radius:99px;background:var(--card);border:1px solid rgba(255,255,255,.12);color:var(--mute);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.mrec svg{color:var(--amber)}.mrec b{color:var(--txt);font-size:18px;letter-spacing:0}
body[data-device=mobile] .mwrap{display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:100%;max-width:480px}
body[data-device=mobile] .mleft{display:contents}
body[data-device=mobile] .brand{align-items:center;text-align:center;margin-top:6vh}
body[data-device=mobile] .brand h2{font-size:54px}
body[data-device=mobile] .mrec{display:flex}
body[data-device=mobile] .mcard{display:none}
body[data-device=mobile] .mnav{margin-top:auto;gap:12px}
body[data-device=mobile] .mbtn{min-height:58px;font-size:18px;padding:14px 18px}
body[data-device=mobile] .mbtn.primary{min-height:70px;font-size:22px}
body[data-device=mobile] .mbtn:hover{transform:none}
.chev{width:20px!important;height:20px!important;color:var(--mute)!important}

/* ===== pantalla de juego ===== */
#scrGame{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));animation:scr .45s ease}
.gleft,.gright{display:flex;flex-direction:column;align-items:center;gap:12px}
.gtop{display:flex;align-items:center;gap:14px;justify-content:center}
h1{font-size:clamp(20px,4vw,32px);letter-spacing:5px;font-weight:700;display:flex;gap:12px;align-items:center}
h1 span{background:linear-gradient(90deg,#9fb4c7,#e6edf3,#4fd1a5,#9fb4c7);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.gbtns{display:flex;gap:8px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 16px;text-align:center;min-width:90px;backdrop-filter:blur(6px)}
.stat small{display:block;color:var(--mute);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.stat b{font-size:22px;display:inline-block;font-variant-numeric:tabular-nums}
.stat.pop b{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.4);color:var(--amber)}}
.wrap{position:relative;width:min(94vw,560px,calc(100vh - var(--rsv)));width:min(94vw,560px,calc(100dvh - var(--rsv)));min-width:240px;aspect-ratio:1;border-radius:14px;padding:5px;
 background:linear-gradient(135deg,#3b4a5a,#2fa392,#7a8794,#2f5f8c,#3b4a5a);background-size:300% 300%;animation:bg 10s linear infinite;
 box-shadow:0 0 30px rgba(47,163,146,.25),0 24px 60px rgba(0,0,0,.6)}
canvas{width:100%;height:100%;display:block;border-radius:10px;background:#0a1015;touch-action:none}
.ov{position:absolute;inset:5px;border-radius:10px;background:rgba(8,13,18,.86);backdrop-filter:blur(5px);display:flex;flex-direction:column;z-index:3;
 align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;animation:in .4s cubic-bezier(.2,1.3,.4,1)}
.ov.hide{display:none}
@keyframes in{from{opacity:0;transform:scale(.9)}}
.ov h2{font-size:clamp(22px,4.5vw,32px);letter-spacing:3px;text-transform:uppercase}
.ov p{color:var(--mute);font-size:14px;max-width:360px;line-height:1.45}
.obtns{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(260px,100%)}
body[data-device=mobile] .obtns .btn{padding:16px}
#hud{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;background:rgba(10,16,22,.82);border:1.5px solid var(--c);color:var(--c);border-radius:8px;padding:3px 9px 3px 6px;
 box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent);animation:chipin .35s cubic-bezier(.2,1.5,.4,1)}
.chip svg{width:18px;height:18px;animation:pulse 1.2s ease-in-out infinite}
.chip span{display:block;width:44px;height:5px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.chip span u{display:block;height:100%;width:100%;background:var(--c);transition:width .1s linear}
@keyframes chipin{from{transform:scale(0)}}
@keyframes pulse{50%{transform:scale(1.18)}}
#legend{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center;color:var(--mute);max-width:620px}
.hints{display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mute);align-items:center}
.hints div{display:flex;gap:4px;align-items:center}
.mhint{color:var(--mute);font-size:12px;letter-spacing:1px}
#dpad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px;touch-action:none}
body[data-device=mobile][data-tc=dpad] #dpad{display:grid}
body[data-device=mobile][data-tc=dpad] .mhint{display:none}
#dpad button{border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;touch-action:none}
#dpad button:active{background:var(--teal)}
#dpad svg{width:28px;height:28px}
.u{grid-area:1/2}.l{grid-area:2/1}.r{grid-area:2/3}.d{grid-area:3/2}
body[data-device=mobile] #scrGame{gap:8px}
body[data-device=mobile] .gtop h1{font-size:18px;letter-spacing:3px}
body[data-device=mobile] .stat{padding:4px 12px;min-width:76px}
body[data-device=mobile] .stat b{font-size:19px}
body[data-device=mobile] .ibtn{width:44px;height:44px}
@media (orientation:landscape) and (max-height:540px){
 body[data-device=mobile]{--rsv:24px}
 body[data-device=mobile] #scrGame{flex-direction:row;gap:14px;justify-content:center}
 body[data-device=mobile] .gleft,body[data-device=mobile] .gright{width:150px}
 body[data-device=mobile] .gtop h1{display:none}
 body[data-device=mobile] .stats{flex-direction:column;flex-wrap:nowrap}
}

/* ===== paneles (ajustes, ayuda, récords) ===== */
.panel{position:fixed;inset:0;z-index:20;background:rgba(3,6,10,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{width:min(540px,100%);max-height:min(88vh,740px);display:flex;flex-direction:column;background:linear-gradient(180deg,#141e29,#0d151d);border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pin .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pin{from{opacity:0;transform:translateY(20px) scale(.96)}}
.chead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.chead h3{font-size:17px;letter-spacing:4px;text-transform:uppercase}
.cbody{padding:6px 18px 20px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px}
.cbody h4{margin:14px 0 4px}
.cbody p,.cbody li{color:#b9c4cf;font-size:14px;line-height:1.5}
.cbody ul{padding-left:18px}
body[data-device=mobile] .panel{place-items:end center;padding:0}
body[data-device=mobile] .card{width:100%;max-height:88dvh;border-radius:20px 20px 0 0;animation:sheet .35s cubic-bezier(.2,1,.3,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheet{from{transform:translateY(100%)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row b{font-weight:600;font-size:15px}.row small{display:block;color:var(--mute);font-size:12px;margin-top:2px;max-width:230px}
.tog{width:50px;height:30px;border-radius:99px;background:#2a3542;position:relative;transition:.2s;flex:none;border:1px solid rgba(255,255,255,.14)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd8e0;transition:.2s}
.tog[aria-checked=true]{background:var(--teal)}.tog[aria-checked=true]::after{transform:translateX(20px);background:#fff}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:7px 12px;border-radius:7px;font-size:13px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--teal);color:#fff}
body[data-device=mobile] .seg button{padding:10px 14px}
input[type=range]{accent-color:var(--teal);width:150px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts .btn{flex:1;font-size:13px;padding:12px 14px;min-width:150px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.scard{background:var(--card);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.scard svg{width:22px;height:22px;color:var(--teal)}
.scard b{font-size:26px;font-variant-numeric:tabular-nums}.scard small{color:var(--mute);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.keys{display:flex;flex-direction:column;gap:8px;font-size:14px;color:#b9c4cf}
.keys div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pv{width:100%;aspect-ratio:360/130;display:block;border-radius:12px;border:1px solid rgba(255,255,255,.1);margin-top:10px}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.skbtn{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);border:1.5px solid rgba(255,255,255,.1);transition:.15s}
.skbtn b{font-size:15px}.skbtn small{color:var(--mute);font-size:12px;line-height:1.3}
.skbtn:hover{border-color:rgba(255,255,255,.3)}.skbtn.on{border-color:var(--teal);background:rgba(47,163,146,.18)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body data-device="desktop" data-tc="swipe">
<div class="orb a"></div><div class="orb b"></div>

<!-- MENÚ PRINCIPAL -->
<section id="scrMenu">
 <div class="mbg"></div><div id="fl"></div>
 <div class="mwrap">
  <div class="mleft">
   <div class="brand">
    <svg class="logo" viewBox="0 0 24 24"><path d="M17 5c-3-2-9-1-9 3s9 4 9 8-6 5-10 3"/><path d="M17.5 5.2h.01"/></svg>
    <h2>SNAKE</h2><small>UPS</small>
   </div>
   <div class="mrec" id="mrec"></div>
   <nav class="mnav" id="mnav" aria-label="Menú principal"></nav>
  </div>
  <aside class="mcard" id="mcard"></aside>
 </div>
</section>

<!-- JUEGO -->
<section id="scrGame" class="off">
 <div class="gleft">
  <div class="gtop">
   <h1><span>SNAKE UPS</span></h1>
   <div class="gbtns"><button class="ibtn" id="bSound" aria-label="Sonido"></button><button class="ibtn" id="bPause" aria-label="Pausa"></button></div>
  </div>
  <div class="stats">
   <div class="stat" id="sS"><small>Puntos</small><b id="score">0</b></div>
   <div class="stat"><small>Récord</small><b id="best">0</b></div>
   <div class="stat" id="sL"><small>Nivel</small><b id="level">1</b></div>
  </div>
 </div>
 <div class="wrap">
  <canvas id="c" width="600" height="600"></canvas>
  <div id="hud"></div>
  <div class="ov hide" id="pause">
   <h2>Pausa</h2>
   <div class="obtns"><button class="btn" id="pResume">Continuar</button><button class="btn ghost" id="pSet">Ajustes</button><button class="btn ghost" id="pMenu">Menú principal</button></div>
  </div>
  <div class="ov hide" id="over">
   <h2 id="overT">Game over</h2><p id="overP"></p>
   <div class="obtns"><button class="btn" id="again">Otra vez</button><button class="btn ghost" id="oMenu">Menú principal</button></div>
  </div>
 </div>
 <div class="gright">
  <div id="dpad">
   <button class="u" data-dx="0" data-dy="-1" aria-label="Arriba"></button><button class="l" data-dx="-1" data-dy="0" aria-label="Izquierda"></button>
   <button class="r" data-dx="1" data-dy="0" aria-label="Derecha"></button><button class="d" data-dx="0" data-dy="1" aria-label="Abajo"></button>
  </div>
  <div class="mhint only-m">Desliza sobre el tablero para girar</div>
  <div class="hints only-pc">
   <div><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> / <kbd>WASD</kbd> mover</div><div><kbd>Espacio</kbd> pausa</div><div><kbd>Esc</kbd> menú</div><div><kbd>M</kbd> sonido</div>
  </div>
  <div id="legend" class="only-pc"></div>
 </div>
</section>

<!-- PANEL GENÉRICO -->
<div class="panel off" id="panel">
 <div class="card" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="chead"><h3 id="ptitle"></h3><button class="ibtn" id="pclose" aria-label="Cerrar"></button></div>
  <div class="cbody" id="pbody"></div>
 </div>
</div>
<script>
let ctx;const cv=document.getElementById('c'),N=20,S=cv.width/N,$=id=>document.getElementById(id);ctx=cv.getContext('2d');
/* ---------- iconos ---------- */

/* ---------- utilidades ---------- */

function spawnApple(){const c=randCell();apple={...c,gold:Math.random()<.15,born:t}}
function spawnItem(){const keys=Object.keys(POW),c=randCell();item={...c,type:keys[rnd(keys.length)],ttl:9000,max:9000}}
function burst(x,y,color,n=18,sp=5){n=Math.max(1,Math.ceil(n*(cfg.fx==='low'?.4:1)));for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(.4+Math.random())*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,d:.015+Math.random()*.025,c:color,r:2+Math.random()*3.5})}}
const kick=v=>{shake=Math.max(shake,v*(cfg.fx==='low'?.35:1))};

function takeItem(){

 if(item.type==='shrink'){snake.splice(Math.max(3,snake.length-3));prev=prev.slice(0,snake.length)}else powers[item.type]=p.dur;

}

function step(){
 prev=snake.map(s=>({...s}));
 if(queue.length){const d=queue.shift();if(!(d.x===-dir.x&&d.y===-dir.y)){if(d.x!==dir.x||d.y!==dir.y){turnPulse=1;burst(cx(snake[0].x),cx(snake[0].y),'#5ee0c0',5,2.2);beep(300,.05,'sine',.025,1.4)}dir=d}}
 const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.x>=N||h.y<0||h.y>=N){
  if(cfg.walls==='wrap'){h.x=(h.x+N)%N;h.y=(h.y+N)%N}
  else if(powers.shield){useShield('Escudo');h.x=(h.x+N)%N;h.y=(h.y+N)%N}
  else return die();
 }
 if(!powers.ghost&&snake.slice(0,-1).some(s=>s.x===h.x&&s.y===h.y)){
  if(powers.shield)useShield('Salvado');else return die();
 }
 snake.unshift(h);
 let grew=false;
 if(h.x===apple.x&&h.y===apple.y)grew=eatApple();
 if(!grew)snake.pop();
 {const tl=snake[snake.length-1];if(cfg.fx==='high'&&Math.random()<.5)burst(cx(tl.x),cx(tl.y),`hsl(${150+rnd(40)},45%,62%)`,1,1.2)}

}

 if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
}

function drawSnake(p){

 const step=S*.18,sm=[{x:pts[0].x,y:pts[0].y,u:0,g:0}];let carry=0,total=0,gi=0;
 for(let i=0;i<L-1;i++){
  const a=pts[i],b=pts[i+1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d>S*1.5){gi++;continue}
  if(d<.01)continue;
  let s0=step-carry;while(s0<=d){const f=s0/d;sm.push({x:a.x+dx*f,y:a.y+dy*f,u:total+s0,g:gi});s0+=step}
  carry=d-(s0-step);total+=d;
 }
 sm.push({x:pts[L-1].x,y:pts[L-1].y,u:total,g:gi});
 const n=sm.length;
 for(let pass=0;pass<2;pass++){
  const src=sm.map(q=>({x:q.x,y:q.y}));
  for(let j=1;j<n;j++){
   let sx=0,sy=0,c=0;
   for(let m=-3;m<=3;m++){const i2=j+m;if(i2<0||i2>=n||sm[i2].g!==sm[j].g)continue;sx+=src[i2].x;sy+=src[i2].y;c++}
   const bl=Math.min(1,j/5);sm[j].x=src[j].x+(sx/c-src[j].x)*bl;sm[j].y=src[j].y+(sy/c-src[j].y)*bl;
  }
 }
 shape(sm,Math.max(total,1));

 ctx.save();renderSkin(sm,E);if(E.shield)drawShield(sm[0].x,sm[0].y);ctx.restore();
}

});
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchmove',e=>{
 if(tx==null)return;const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
 if(Math.abs(dx)>22||Math.abs(dy)>22){Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));haptic(6);tx=e.touches[0].clientX;ty=e.touches[0].clientY}
},{passive:true});
cv.addEventListener('touchend',()=>{tx=null});
const ARR={u:AU,d:AD,l:AL,r:AR};
document.querySelectorAll('#dpad button').forEach(b=>{
 b.innerHTML=svg(ARR[b.className],28);
 b.addEventListener('pointerdown',e=>{e.preventDefault();turn(+b.dataset.dx,+b.dataset.dy);haptic(8)});
});

/* ---------- botones y arranque ---------- */
$('bPause').innerHTML=svg(PAUSE,20);$('pclose').innerHTML=svg(CLOSE,20);syncSound();
$('bSound').onclick=()=>{$('bSound').blur();toggleSound()};
$('bPause').onclick=()=>{$('bPause').blur();if(state==='play'||state==='pause')togglePause()};
$('pResume').onclick=togglePause;
$('pSet').onclick=()=>openPanel('set');
$('pMenu').onclick=toMenu;$('again').onclick=start;$('oMenu').onclick=toMenu;
$('pclose').onclick=closePanel;
$('panel').addEventListener('click',e=>{if(e.target===$('panel'))closePanel()});
$('legend').innerHTML=Object.values(POW).map(p=>`<div class="leg" style="--c:${p.color}">${svg(p.ic)}${p.name}</div>`).join('');
$('fl').innerHTML=Array.from({length:9},(_,i)=>{const ks=Object.keys(POW),d=i%2?POW[ks[i%ks.length]].ic:APPLE;return `<div class="fl" style="left:${(i*11+5)%96}%;--s:${22+(i*7)%22}px;animation-duration:${14+(i*3)%10}s;animation-delay:-${(i*2.3)%14}s">${svg(d,24)}</div>`}).join('');
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(detect()!==DEV)applyDevice()},120)});
addEventListener('blur',()=>{if(state==='play')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
reset();applyDevice();setScreen('menu');requestAnimationFrame(loop);
</script>
</body>
</html>
